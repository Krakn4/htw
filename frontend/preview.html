<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Findly.ai – Smart Campus Lost & Found Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --espresso: #211C19;
      --dark-chocolate: #49352A;
      --mocha-brown: #795C48;
      --warm-beige: #D8C3A5;
      --beige-light: #EBE3D5;
      --cream: #F5EFE6;
      --soft-ivory: #FAF8F3;

      --bg-body: var(--soft-ivory);
      --bg-card: #FFFFFF;
      --bg-subtle: #F6F2EC;
      --text-main: var(--espresso);
      --text-muted: #5C4B41;
      --text-light: #8E7A6E;

      --border-color: rgba(73, 53, 42, 0.14);
      --border-focus: var(--dark-chocolate);
      --primary: var(--dark-chocolate);
      --primary-hover: var(--espresso);

      --success: #3D5A40;
      --success-light: #EBF2EC;
      --success-text: #283F2B;
      --danger: #8C3A27;
      --danger-light: #FAEEEB;
      --danger-text: #692415;

      --shadow-sm: 0 2px 4px rgba(33, 28, 25, 0.04);
      --shadow-md: 0 6px 16px rgba(33, 28, 25, 0.06);
      --shadow-lg: 0 12px 28px rgba(33, 28, 25, 0.08);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
    h1, h2, h3, h4 { font-family: var(--font-serif); color: var(--espresso); letter-spacing: -0.015em; font-weight: 700; }
    button, input, select, textarea { font-family: var(--font-sans); }
    a { color: inherit; text-decoration: none; }

    .app-container { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--soft-ivory); }
    .main-content { flex: 1; max-width: 1240px; width: 100%; margin: 0 auto; padding: 32px 24px 80px; }

    .navbar { background: rgba(250, 248, 243, 0.96); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
    .navbar-inner { max-width: 1380px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand-logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-serif); font-weight: 800; font-size: 1.42rem; color: var(--espresso); cursor: pointer; letter-spacing: -0.02em; flex-shrink: 0; white-space: nowrap; }
    .brand-icon-box { width: 38px; height: 38px; background: var(--dark-chocolate); border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--soft-ivory); font-weight: 700; flex-shrink: 0; box-shadow: 0 3px 10px rgba(73, 53, 42, 0.18); }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; background: rgba(245, 239, 230, 0.85); padding: 5px 6px; border-radius: var(--radius-full); border: 1px solid var(--border-color); flex-wrap: nowrap; }
    .nav-item { padding: 7px 13px; border-radius: var(--radius-full); font-weight: 500; font-size: 0.83rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.2; }
    .nav-item:hover { color: var(--espresso); background-color: #ffffff; }
    .nav-item.active { color: var(--soft-ivory); background-color: var(--dark-chocolate); font-weight: 600; box-shadow: 0 2px 8px rgba(73, 53, 42, 0.22); }
    .nav-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; white-space: nowrap; }

    .icon-btn { background: var(--cream); border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.2s; color: var(--espresso); flex-shrink: 0; }
    .notification-count { position: absolute; top: -4px; right: -4px; background: var(--danger); color: white; font-size: 0.7rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--soft-ivory); }

    .user-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--cream); padding: 4px 14px 4px 5px; border-radius: var(--radius-full); border: 1px solid var(--border-color); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; }
    .user-chip:hover { border-color: var(--mocha-brown); background: #ffffff; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--dark-chocolate), var(--mocha-brown)); color: var(--soft-ivory); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 600; flex-shrink: 0; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px; border-radius: var(--radius-md); font-size: 0.92rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.25s ease; white-space: nowrap; }
    .btn-primary { background: var(--dark-chocolate); color: var(--soft-ivory); box-shadow: 0 4px 12px rgba(73, 53, 42, 0.2); }
    .btn-primary:hover { background: var(--espresso); box-shadow: 0 6px 16px rgba(33, 28, 25, 0.3); transform: translateY(-1px); }
    .btn-outline { background: #ffffff; color: var(--espresso); border: 1.5px solid var(--warm-beige); }
    .btn-outline:hover { background: var(--cream); border-color: var(--mocha-brown); color: var(--dark-chocolate); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-danger:hover { background: #692415; }
    .btn-success { background: var(--success); color: #ffffff; }
    .btn-success:hover { background: var(--success-text); }
    .btn-lg { padding: 15px 32px; font-size: 1.02rem; border-radius: var(--radius-full); }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: var(--radius-full); font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-lost { background-color: var(--danger-light); color: var(--danger-text); border: 1px solid #f3cdc5; }
    .badge-found { background-color: var(--success-light); color: var(--success-text); border: 1px solid #c8decb; }
    .badge-ai { background: var(--cream); color: var(--dark-chocolate); border: 1px solid var(--warm-beige); font-weight: 700; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .card:hover { box-shadow: var(--shadow-md); border-color: var(--warm-beige); }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

    @media (max-width: 900px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .nav-links { display: none !important; }
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .form-label { font-size: 0.88rem; font-weight: 600; color: var(--espresso); }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.92rem; background: #ffffff; color: var(--espresso); outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--mocha-brown); box-shadow: 0 0 0 3px rgba(121, 92, 72, 0.15); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(33, 28, 25, 0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #ffffff; border-radius: var(--radius-lg); max-width: 560px; width: 100%; box-shadow: var(--shadow-xl); border: 1px solid var(--warm-beige); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--cream); }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--soft-ivory); display: flex; justify-content: flex-end; gap: 12px; }

    .toast-banner { position: fixed; bottom: 24px; right: 24px; background: var(--espresso); color: var(--soft-ivory); padding: 14px 22px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; z-index: 1100; border: 1px solid var(--mocha-brown); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_ITEMS = [
      {
        id: 'item-101',
        type: 'lost',
        title: 'Navy Blue Dell Laptop Bag',
        category: 'Bags & Backpacks',
        date: '2026-11-12',
        location: 'Central Library, 2nd Floor',
        description: 'Dark blue backpack with padded straps. Has a red metal carabiner on the side loop and Dell logo embossed on front.',
        imageUrl: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80',
        rewardBudget: 100,
        hasMatch: true
      },
      {
        id: 'item-102',
        type: 'found',
        title: 'Navy Dell Backpack with Cables',
        category: 'Bags & Backpacks',
        date: '2026-11-12',
        location: 'Central Library, Reading Hall B',
        description: 'Found unattended at desk 14. Deep navy blue color with Dell branding. Handed over to library reception desk.',
        imageUrl: 'https://images.unsplash.com/photo-1546938576-6e6a64f317cc?auto=format&fit=crop&w=600&q=80',
        rewardBudget: 100,
        hasMatch: true
      },
      {
        id: 'item-103',
        type: 'found',
        title: 'Student ID Card - CSE 2nd Year',
        category: 'Cards & IDs',
        date: '2026-11-13',
        location: 'Campus Canteen, Near Counter 3',
        description: 'University smart ID card with lanyard. Department of Computer Science.',
        imageUrl: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80',
        hasMatch: false
      },
      {
        id: 'item-104',
        type: 'found',
        title: 'AirPods Pro Gen 2 Case',
        category: 'Electronics',
        date: '2026-11-11',
        location: 'Indoor Sports Complex - Gym',
        description: 'Glossy white charging case with subtle scratch near hinge. Turned into sports office.',
        imageUrl: 'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?auto=format&fit=crop&w=600&q=80',
        hasMatch: false
      },
      {
        id: 'item-105',
        type: 'lost',
        title: 'Casio Scientific Calculator fx-991EX',
        category: 'Stationery',
        date: '2026-11-12',
        location: 'Block C, Room 304 (Math Lecture)',
        description: 'ClassWiz model with protective slide cover. Small yellow sticker with initials "AS" on backside.',
        imageUrl: 'https://images.unsplash.com/photo-1587145820266-a5951ee6f620?auto=format&fit=crop&w=600&q=80',
        rewardBudget: 50,
        hasMatch: false
      },
      {
        id: 'item-106',
        type: 'found',
        title: 'Dorm Key Set with Batman Keychain',
        category: 'Keys',
        date: '2026-11-10',
        location: 'Hostel Block 4 Walkway',
        description: 'Three brass keys on a black metallic keyring with a Batman charm.',
        imageUrl: 'https://images.unsplash.com/photo-1582139329536-e7284fece509?auto=format&fit=crop&w=600&q=80',
        hasMatch: false
      }
    ];

    const GOGRAB_SNACKS = [
      { id: '1', name: 'Cold Coffee 200ml', price: 40, icon: '☕' },
      { id: '2', name: 'Snickers Almond', price: 50, icon: '🍫' },
      { id: '3', name: 'Magic Masala Chips', price: 20, icon: '🥔' },
      { id: '4', name: 'Raw Coconut Water', price: 60, icon: '🥥' },
      { id: '5', name: 'RiteBite Protein Bar', price: 80, icon: '💪' },
      { id: '6', name: 'Red Bull Energy 250ml', price: 125, icon: '⚡' }
    ];

    const BACKEND_API = 'http://localhost:8000';

    function App() {
      const [activePage, setActivePage] = useState('home');
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [liveMatch, setLiveMatch] = useState(null);
      const [claimAnswer, setClaimAnswer] = useState('');
      const [walletBalance, setWalletBalance] = useState(150);
      const [cart, setCart] = useState({});
      const [selectedDetail, setSelectedDetail] = useState(null);
      const [claimTarget, setClaimTarget] = useState(null);
      const [toast, setToast] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedType, setSelectedType] = useState('all');
      const [selectedCategory, setSelectedCategory] = useState('all');

      // Auth & Dashboard states
      const [currentUser, setCurrentUser] = useState({
        id: 'user-aarav',
        email: 'arjun@univ.edu',
        name: 'Aarav Sharma',
        roll_number: '24BCE1042',
        department: 'B.Tech Computer Science & Engineering',
        hostel: 'Hostel Block 4',
        role: 'student'
      });
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [authEmail, setAuthEmail] = useState('arjun@univ.edu');
      const [authPassword, setAuthPassword] = useState('campus123');
      const [authName, setAuthName] = useState('');
      const [authRoll, setAuthRoll] = useState('');
      const [authDept, setAuthDept] = useState('B.Tech Computer Science & Engineering');
      const [authHostel, setAuthHostel] = useState('Hostel Block 4');
      const [authRole, setAuthRole] = useState('student');
      const [claimsList, setClaimsList] = useState([]);
      const [notifsList, setNotifsList] = useState([]);

      const refreshClaimsAndNotifs = async (userObj) => {
        const u = userObj || currentUser;
        try {
          const [cRes, nRes] = await Promise.all([
            fetch(`${BACKEND_API}/claims`),
            fetch(`${BACKEND_API}/notifications${u?.email ? `?user=${encodeURIComponent(u.email)}` : ''}`)
          ]);
          if (cRes.ok) setClaimsList(await cRes.json());
          if (nRes.ok) setNotifsList(await nRes.json());
        } catch (e) {}
      };

      // Load live items and live AI match from Python FastAPI backend (http://localhost:8000)
      React.useEffect(() => {
        async function syncBackend() {
          try {
            const res = await fetch(`${BACKEND_API}/items`);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                const mapped = data.map(it => ({
                  ...it,
                  imageUrl: it.image_url || 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80',
                  rewardBudget: 100,
                  hasMatch: true
                }));
                setItems([...mapped, ...INITIAL_ITEMS]);
              }
            }
            const mRes = await fetch(`${BACKEND_API}/matches/lost-wallet-fossil`);
            const qRes = await fetch(`${BACKEND_API}/items/lost-wallet-fossil`);
            if (mRes.ok && qRes.ok) {
              const mList = await mRes.json();
              const qItem = await qRes.json();
              if (Array.isArray(mList) && mList.length > 0) {
                setLiveMatch({ queryItem: qItem, bestMatch: mList[0], allMatches: mList });
              }
            }
            await refreshClaimsAndNotifs();
          } catch (e) {}
        }
        syncBackend();
      }, []);

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        try {
          const endpoint = authMode === 'login' ? '/auth/login' : '/auth/signup';
          const body = authMode === 'login'
            ? { email: authEmail, password: authPassword }
            : {
                email: authEmail,
                password: authPassword,
                name: authName || 'Campus Student',
                roll_number: authRoll || '24BCE1099',
                department: authDept,
                hostel: authHostel,
                role: authRole
              };
          const res = await fetch(`${BACKEND_API}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.detail || data.error || 'Authentication failed');
            return;
          }
          setCurrentUser(data);
          if (typeof data.wallet_balance === 'number') setWalletBalance(data.wallet_balance);
          await refreshClaimsAndNotifs(data);
          showToast(`👋 Signed in as ${data.name} (${data.role.toUpperCase()})`);
          setActivePage('dashboard');
        } catch (err) {
          alert('Could not reach backend auth service.');
        }
      };

      const handleQuickDemoLogin = async (email, password) => {
        setAuthEmail(email);
        setAuthPassword(password);
        try {
          const res = await fetch(`${BACKEND_API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (res.ok) {
            const data = await res.json();
            setCurrentUser(data);
            if (typeof data.wallet_balance === 'number') setWalletBalance(data.wallet_balance);
            await refreshClaimsAndNotifs(data);
            showToast(`👋 Switched account to ${data.name} (${data.role.toUpperCase()})`);
            setActivePage('dashboard');
          }
        } catch (e) {}
      };

      const handleClaimDecision = async (claimId, newStatus) => {
        try {
          const res = await fetch(`${BACKEND_API}/claims/${claimId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            showToast(`🛡️ Claim ${newStatus.toUpperCase()}!`);
            await refreshClaimsAndNotifs();
          }
        } catch (e) {}
      };

      // Report form states
      const [formTitle, setFormTitle] = useState('');
      const [formCategory, setFormCategory] = useState('wallet');
      const [formDate, setFormDate] = useState('2026-11-13');
      const [formLocation, setFormLocation] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formReward, setFormReward] = useState(0);
      const [formImage, setFormImage] = useState('');
      const [formFile, setFormFile] = useState(null);
      const [formVerifQuestion, setFormVerifQuestion] = useState('');
      const [formVerifAnswer, setFormVerifAnswer] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      const viewMatchesForItem = async (item) => {
        if (item && item.id) {
          try {
            const [mRes, qRes] = await Promise.all([
              fetch(`${BACKEND_API}/matches/${item.id}`),
              fetch(`${BACKEND_API}/items/${item.id}`)
            ]);
            if (mRes.ok && qRes.ok) {
              const mList = await mRes.json();
              const qItem = await qRes.json();
              if (Array.isArray(mList) && mList.length > 0) {
                setLiveMatch({ queryItem: qItem, bestMatch: mList[0], allMatches: mList });
              }
            }
          } catch (e) {}
        }
        setActivePage('matches');
      };

      const handleFileUploadChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setFormFile(file);
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormImage(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handlePresetSelect = async (presetUrl, presetCat) => {
        setFormImage(presetUrl);
        if (presetCat) setFormCategory(presetCat);
        try {
          const resp = await fetch(presetUrl);
          const blob = await resp.blob();
          setFormFile(new File([blob], 'preset.jpg', { type: blob.type || 'image/jpeg' }));
        } catch (e) {
          setFormFile(null);
        }
      };

      const handleReportSubmit = async (type) => {
        if (type === 'found' && !formImage && !formFile) {
          alert('Please upload a photo (or select a sample image) of the item you found!');
          return;
        }
        if (!formTitle || !formLocation) {
          alert('Please fill out the item name and campus location.');
          return;
        }
        if (type === 'lost' && !formImage && !formFile && !formDesc.trim()) {
          alert('Since you have no photo of the lost item, please write a brief description so our AI can match your text description against found item photos!');
          return;
        }
        setIsSubmitting(true);
        try {
          const fd = new FormData();
          fd.append('type', type);
          fd.append('title', formTitle);
          fd.append('category', formCategory);
          fd.append('date', formDate);
          fd.append('location', formLocation);
          fd.append('description', formDesc || '');
          fd.append('reporter_name', currentUser ? currentUser.email : 'Aarav Sharma');
          if (type === 'found') {
            fd.append('verification_question', formVerifQuestion);
            fd.append('verification_answer', formVerifAnswer);
          }
          if (formFile) {
            fd.append('image', formFile, formFile.name || 'upload.jpg');
          } else if (formImage) {
            const r = await fetch(formImage);
            const b = await r.blob();
            fd.append('image', b, 'upload.jpg');
          }
          const res = await fetch(`${BACKEND_API}/items`, { method: 'POST', body: fd });
          if (res.ok) {
            const created = await res.json();
            const newItem = {
              ...created,
              imageUrl: created.image_url || formImage,
              rewardBudget: type === 'lost' ? formReward : 0,
              hasMatch: true
            };
            setItems([newItem, ...items]);
            setIsSubmitting(false);
            showToast(`✨ ${type === 'lost' ? 'Lost report' : 'Found item'} saved! Opening live AI matches...`);
            setFormTitle('');
            setFormLocation('');
            setFormDesc('');
            setFormImage('');
            setFormFile(null);
            setFormVerifQuestion('');
            setFormVerifAnswer('');
            await viewMatchesForItem(created);
            return;
          }
        } catch (e) {}

        setTimeout(() => {
          const newItem = {
            id: 'item-' + Date.now(),
            type: type,

                </div>

                {cartTotal > 0 && (
                  <div className="card" style={{ background: 'var(--cream)', padding: '24px' }}>
                    <h3>Checkout Breakdown</h3>
                    <p>Total: ₹{cartTotal} | Wallet Applied: -₹{walletUsed} | Remaining UPI: <strong>₹{remainingUpi}</strong></p>
                    <button className="btn btn-primary" style={{ marginTop: '12px' }} onClick={() => {
                      setWalletBalance(prev => Math.max(0, prev - walletUsed));
                      showToast('🥤 Token generated! GoGrab Machine #01 dispensing items.');
                      setCart({});
                    }}>
                      Generate GoGrab Token 🎟️
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PAGE 8: ACHIEVEMENTS */}
            {activePage === 'achievements' && (
              <div style={{ maxWidth: '960px', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: '24px' }}>
                <h1 style={{ fontSize: '2rem', fontWeight: 800 }}>My Appreciation Badges</h1>
                <div className="grid-3">
                  {[
                    { name: 'First Finder', icon: '🌱', desc: '1 verified return', unlocked: true },
                    { name: 'Helping Hand', icon: '🤝', desc: '3 verified returns', unlocked: true },
                    { name: 'Campus Hero', icon: '🏅', desc: '5 verified returns', unlocked: false },
                    { name: 'Sharp Eye', icon: '🔍', desc: 'High quality found report', unlocked: true },
                    { name: 'Selfless Soul', icon: '💖', desc: 'Declined monetary reward', unlocked: false }
                  ].map(b => (
                    <div key={b.name} className="card" style={{ opacity: b.unlocked ? 1 : 0.6, background: b.unlocked ? '#ffffff' : 'var(--cream)' }}>
                      <div style={{ fontSize: '2.5rem' }}>{b.icon}</div>
                      <h3 style={{ margin: '8px 0 4px' }}>{b.name}</h3>
                      <p style={{ fontSize: '0.84rem', color: 'var(--text-muted)' }}>{b.desc}</p>
                      <span className="badge" style={{ marginTop: '10px', background: b.unlocked ? 'var(--success-light)' : '#e2e8f0' }}>
                        {b.unlocked ? 'UNLOCKED' : 'LOCKED'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Verification Claim Modal */}
          {claimTarget && (
            <div className="modal-overlay" onClick={() => setClaimTarget(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>🛡️ Anti-Fraud Ownership Verification</h3>
                  <button onClick={() => setClaimTarget(null)} style={{ background: 'none', border: 'none', cursor: 'pointer' }}>✕</button>
                </div>
                <div className="modal-body">
                  <p style={{ marginBottom: '10px', fontSize: '0.92rem' }}>
                    Claiming: <strong>{claimTarget.title}</strong>
                  </p>
                  <p style={{ marginBottom: '12px', fontSize: '0.88rem', background: 'var(--soft-ivory)', padding: '10px', borderRadius: '8px', border: '1px solid var(--warm-beige)' }}>
                    🔒 <strong>Verification Question:</strong> {claimTarget.verification_question || 'What identifying sticker, keychain, or secret detail is on this item?'}
                  </p>
                  <textarea
                    className="form-textarea"
                    rows={3}
                    placeholder="Type your verification answer (e.g. 'Star Wars' for the Fossil wallet)..."
                    value={claimAnswer}
                    onChange={e => setClaimAnswer(e.target.value)}
                  />
                </div>
                <div className="modal-footer">
                  <button className="btn btn-outline" onClick={() => setClaimTarget(null)}>Cancel</button>
                  <button className="btn btn-primary" onClick={handleClaimAndReleaseReward}>
                    Confirm & Release ₹100 Reward
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Details Modal */}
          {selectedDetail && (
            <div className="modal-overlay" onClick={() => setSelectedDetail(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>{selectedDetail.title}</h3>
                  <button onClick={() => setSelectedDetail(null)} style={{ background: 'none', border: 'none', cursor: 'pointer' }}>✕</button>
                </div>
                <div className="modal-body">
                  <img src={selectedDetail.imageUrl} style={{ width: '100%', height: '220px', objectFit: 'cover', borderRadius: '12px', marginBottom: '14px' }} />
                  <p><strong>Category:</strong> {selectedDetail.category}</p>
                  <p><strong>Location:</strong> {selectedDetail.location}</p>
                  <p><strong>Reported:</strong> {selectedDetail.date}</p>
                  <p style={{ marginTop: '8px' }}>{selectedDetail.description}</p>
                </div>
                <div className="modal-footer">
                  <button className="btn btn-outline" onClick={() => setSelectedDetail(null)}>Close</button>
                  <button className="btn btn-primary" onClick={() => {
                    const itm = selectedDetail;
                    setSelectedDetail(null);
                    setClaimTarget(itm);
                  }}>Claim Item</button>
                </div>
              </div>
            </div>
          )}

          {toast && <div className="toast-banner"><span>✨</span> {toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
